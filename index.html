<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GO 취업 - AI 기반 이력서 생성 및 공고 분석</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            background: #f5f5f5;
        }

        .tab-button {
            flex: 1;
            padding: 15px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: white;
        }

        .tab-button:hover {
            background: white;
        }

        .tab-content {
            display: none;
            padding: 40px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: #f0f0f0;
            color: #333;
        }

        .button.secondary:hover {
            background: #e0e0e0;
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert.info {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }

        .alert.success {
            background: #e8f5e9;
            color: #388e3c;
            border-left: 4px solid #388e3c;
        }

        .alert.error {
            background: #ffebee;
            color: #d32f2f;
            border-left: 4px solid #d32f2f;
        }

        .alert.warning {
            background: #fff3e0;
            color: #f57c00;
            border-left: 4px solid #f57c00;
        }

        .output-box {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 20px;
            margin-top: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            max-height: 500px;
            overflow-y: auto;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .profile-info {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .profile-info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .profile-info-item:last-child {
            border-bottom: none;
        }

        .profile-info-label {
            font-weight: 500;
            color: #666;
        }

        .profile-info-value {
            color: #333;
        }

        .skill-tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            margin-right: 8px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .api-key-input {
            background: #fff3cd;
            border: 1px solid #ffc107 !important;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .api-key-input p {
            margin-bottom: 10px;
            font-size: 13px;
            color: #856404;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 24px;
            }

            .tab-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 GO 취업</h1>
            <p>AI 기반 이력서 생성 및 채용 공고 직무 매칭 도구</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab('profile')">📋 프로필</button>
            <button class="tab-button" onclick="showTab('resume')">📄 이력서 생성</button>
            <button class="tab-button" onclick="showTab('analysis')">🎯 공고 분석</button>
            <button class="tab-button" onclick="showTab('settings')">⚙️ 설정</button>
        </div>

        <!-- 프로필 탭 -->
        <div id="profile" class="tab-content active">
            <h2>📋 프로필 관리</h2>
            <p style="color: #666; margin-bottom: 20px;">당신의 정보를 입력하고 저장하세요. 모든 데이터는 로컬에 저장됩니다.</p>

            <div id="profileInfo"></div>

            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" id="name" placeholder="예: 김철수">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="phone">전화번호</label>
                    <input type="tel" id="phone" placeholder="010-1234-5678">
                </div>
            </div>

            <div class="form-group">
                <label for="position">지원 직무</label>
                <input type="text" id="position" placeholder="예: 프론트엔드 개발자, 데이터 과학자">
            </div>

            <div class="form-group">
                <label for="experience">경력 (년)</label>
                <input type="number" id="experience" min="0" max="50" placeholder="예: 3">
            </div>

            <div class="form-group">
                <label for="skills">주요 스킬 (쉼표로 구분)</label>
                <textarea id="skills" placeholder="예: Python, React, SQL, AWS"></textarea>
            </div>

            <div class="form-group">
                <label for="education">학력</label>
                <textarea id="education" placeholder="예: 서울대학교 컴퓨터공학과 졸업 (2020)"></textarea>
            </div>

            <div class="form-group">
                <label for="experience_desc">경력 기술</label>
                <textarea id="experience_desc" placeholder="주요 프로젝트, 업적, 책임 사항 등을 간단히 적어주세요."></textarea>
            </div>

            <div class="button-group">
                <button class="button" onclick="saveProfile()">💾 프로필 저장</button>
                <button class="button secondary" onclick="clearProfile()">🗑️ 초기화</button>
            </div>
        </div>

        <!-- 이력서 생성 탭 -->
        <div id="resume" class="tab-content">
            <h2>📄 AI 이력서 생성</h2>
            <p style="color: #666; margin-bottom: 20px;">저장된 프로필을 기반으로 AI가 이력서를 생성합니다.</p>

            <div id="resumeAlert"></div>

            <div class="form-group">
                <label for="jobTitle">지원 기업 및 직무 (선택사항)</label>
                <input type="text" id="jobTitle" placeholder="예: 카카오 - 백엔드 개발자">
            </div>

            <div class="form-group">
                <label for="additionalInfo">추가 정보 (선택사항)</label>
                <textarea id="additionalInfo" placeholder="이력서에 포함하고 싶은 추가 정보나 강조할 사항"></textarea>
            </div>

            <button class="button" onclick="generateResume()">✨ 이력서 생성</button>

            <div id="resumeOutput"></div>
        </div>

        <!-- 공고 분석 탭 -->
        <div id="analysis" class="tab-content">
            <h2>🎯 채용 공고 직무 매칭</h2>
            <p style="color: #666; margin-bottom: 20px;">채용 공고를 입력하면 당신과의 적합도를 분석합니다.</p>

            <div id="analysisAlert"></div>

            <div class="form-group">
                <label for="jobPosting">채용 공고</label>
                <textarea id="jobPosting" placeholder="채용 공고 전체 내용을 여기에 붙여넣기하세요."></textarea>
            </div>

            <button class="button" onclick="analyzePosting()">🔍 분석</button>

            <div id="analysisOutput"></div>
        </div>

        <!-- 설정 탭 -->
        <div id="settings" class="tab-content">
            <h2>⚙️ 설정</h2>

            <div class="api-key-input">
                <p>🔑 <strong>API 키 설정</strong></p>
                <p>Anthropic API 키를 입력하세요. 로컬에만 저장되며 외부로 전송되지 않습니다.</p>
                <p><a href="https://console.anthropic.com/account/keys" target="_blank" style="color: #0066cc;">API 키 발급 받기</a></p>
            </div>

            <div class="form-group">
                <label for="apiKey">Anthropic API 키</label>
                <input type="password" id="apiKey" placeholder="sk-ant-...">
            </div>

            <div class="form-group">
                <label for="model">AI 모델</label>
                <select id="model">
                    <option value="claude-opus-4-8">Claude 3.5 Opus (최고 성능)</option>
                    <option value="claude-sonnet-4-6" selected>Claude 3.5 Sonnet (추천)</option>
                    <option value="claude-haiku-4-5">Claude 3.5 Haiku (빠름)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tone">작성 톤</label>
                <select id="tone">
                    <option value="formal" selected>정중함 (정식 이력서)</option>
                    <option value="casual">자연스러움 (자기소개서)</option>
                    <option value="technical">기술적 (기술 중심)</option>
                </select>
            </div>

            <div class="button-group">
                <button class="button" onclick="saveSettings()">💾 설정 저장</button>
                <button class="button secondary" onclick="testApi()">🧪 API 연결 테스트</button>
            </div>

            <div id="settingsOutput"></div>

            <hr style="margin: 30px 0; border: none; border-top: 1px solid #e0e0e0;">

            <h3 style="margin-top: 30px; margin-bottom: 15px;">📊 데이터 관리</h3>
            <button class="button secondary" onclick="exportData()">📤 데이터 내보내기</button>
            <button class="button secondary" onclick="importData()">📥 데이터 가져오기</button>
            <button class="button secondary" onclick="clearAllData()" style="background: #ffebee; color: #d32f2f;">🗑️ 모든 데이터 삭제</button>
        </div>
    </div>

    <script>
        const API_BASE = 'https://api.anthropic.com/v1';

        // 탭 전환
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // 프로필 저장
        function saveProfile() {
            const profile = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                position: document.getElementById('position').value,
                experience: document.getElementById('experience').value,
                skills: document.getElementById('skills').value,
                education: document.getElementById('education').value,
                experience_desc: document.getElementById('experience_desc').value,
            };

            if (!profile.name) {
                alert('이름을 입력해주세요.');
                return;
            }

            localStorage.setItem('profile', JSON.stringify(profile));
            showAlert('profileInfo', '✅ 프로필이 저장되었습니다.', 'success');
            displayProfile();
        }

        // 프로필 표시
        function displayProfile() {
            const profile = JSON.parse(localStorage.getItem('profile') || '{}');
            const container = document.getElementById('profileInfo');

            if (!profile.name) {
                container.innerHTML = '';
                return;
            }

            const skills = profile.skills ? profile.skills.split(',').map(s => `<span class="skill-tag">${s.trim()}</span>`).join('') : '';

            container.innerHTML = `
                <div class="profile-info">
                    <div class="profile-info-item">
                        <span class="profile-info-label">이름</span>
                        <span class="profile-info-value">${profile.name}</span>
                    </div>
                    <div class="profile-info-item">
                        <span class="profile-info-label">지원 직무</span>
                        <span class="profile-info-value">${profile.position || '-'}</span>
                    </div>
                    <div class="profile-info-item">
                        <span class="profile-info-label">경력</span>
                        <span class="profile-info-value">${profile.experience || '-'} 년</span>
                    </div>
                    <div class="profile-info-item">
                        <span class="profile-info-label">스킬</span>
                        <div style="width: 60%;">${skills || '-'}</div>
                    </div>
                </div>
            `;
        }

        // 프로필 초기화
        function clearProfile() {
            if (confirm('프로필을 초기화하시겠습니까?')) {
                document.querySelectorAll('input[type="text"], input[type="email"], input[type="tel"], input[type="number"], textarea').forEach(el => {
                    if (!el.id.startsWith('job') && !el.id.startsWith('additional') && !el.id.startsWith('api') && el.id !== 'model' && el.id !== 'tone') {
                        el.value = '';
                    }
                });
                localStorage.removeItem('profile');
                document.getElementById('profileInfo').innerHTML = '';
                showAlert('profileInfo', '✅ 프로필이 초기화되었습니다.', 'success');
            }
        }

        // 이력서 생성
        async function generateResume() {
            const profile = JSON.parse(localStorage.getItem('profile') || '{}');
            const apiKey = localStorage.getItem('apiKey');

            if (!profile.name) {
                showAlert('resumeAlert', '⚠️ 먼저 프로필을 저장해주세요.', 'warning');
                return;
            }

            if (!apiKey) {
                showAlert('resumeAlert', '⚠️ 먼저 API 키를 설정해주세요.', 'warning');
                return;
            }

            const jobTitle = document.getElementById('jobTitle').value;
            const additionalInfo = document.getElementById('additionalInfo').value;
            const model = localStorage.getItem('model') || 'claude-sonnet-4-6';
            const tone = localStorage.getItem('tone') || 'formal';

            const prompt = `다음 정보를 바탕으로 한국어 이력서를 작성해주세요.

이름: ${profile.name}
이메일: ${profile.email}
전화: ${profile.phone}
지원 직무: ${profile.position}
경력: ${profile.experience}년
학력: ${profile.education}
스킬: ${profile.skills}
경력 기술:
${profile.experience_desc}

${jobTitle ? `지원 기업/직무: ${jobTitle}` : ''}
${additionalInfo ? `추가 정보: ${additionalInfo}` : ''}

톤: ${tone === 'formal' ? '정중하고 전문적' : tone === 'casual' ? '자연스럽고 친근' : '기술적이고 구체적'}

한국어로 된 전문적이고 설득력 있는 이력서를 작성해주세요.`;

            showAlert('resumeAlert', '⏳ 이력서를 생성 중입니다...', 'info');
            document.getElementById('resumeOutput').innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/messages`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: model,
                        max_tokens: 2000,
                        messages: [
                            { role: 'user', content: prompt }
                        ]
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 오류: ${response.status}`);
                }

                const data = await response.json();
                const resume = data.content[0].text;

                showAlert('resumeAlert', '✅ 이력서가 생성되었습니다.', 'success');
                document.getElementById('resumeOutput').innerHTML = `
                    <div class="output-box">${resume}</div>
                    <div style="margin-top: 15px;">
                        <button class="button secondary" onclick="copyToClipboard('resumeOutput')">📋 복사</button>
                        <button class="button secondary" onclick="downloadText('resume_${new Date().getTime()}.txt', document.querySelector('#resumeOutput .output-box').innerText)">⬇️ 다운로드</button>
                    </div>
                `;
            } catch (error) {
                showAlert('resumeAlert', `❌ 오류: ${error.message}`, 'error');
            }
        }

        // 공고 분석
        async function analyzePosting() {
            const profile = JSON.parse(localStorage.getItem('profile') || '{}');
            const apiKey = localStorage.getItem('apiKey');
            const posting = document.getElementById('jobPosting').value;

            if (!posting) {
                showAlert('analysisAlert', '⚠️ 채용 공고를 입력해주세요.', 'warning');
                return;
            }

            if (!profile.name) {
                showAlert('analysisAlert', '⚠️ 먼저 프로필을 저장해주세요.', 'warning');
                return;
            }

            if (!apiKey) {
                showAlert('analysisAlert', '⚠️ 먼저 API 키를 설정해주세요.', 'warning');
                return;
            }

            const model = localStorage.getItem('model') || 'claude-sonnet-4-6';

            const prompt = `다음은 지원자의 프로필입니다:
이름: ${profile.name}
지원 직무: ${profile.position}
경력: ${profile.experience}년
스킬: ${profile.skills}
학력: ${profile.education}

다음은 채용 공고입니다:
${posting}

이 채용 공고에 대해 지원자의 적합도를 다음 항목으로 분석해주세요:
1. 직무 적합도 (0-100%)
2. 스킬 매칭율
3. 경력 요구사항 충족도
4. 강점 (3가지)
5. 약점 또는 개선 필요 영역 (3가지)
6. 지원 전 준비 사항

한국어로 분석해주세요.`;

            showAlert('analysisAlert', '⏳ 공고를 분석 중입니다...', 'info');
            document.getElementById('analysisOutput').innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/messages`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: model,
                        max_tokens: 2000,
                        messages: [
                            { role: 'user', content: prompt }
                        ]
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 오류: ${response.status}`);
                }

                const data = await response.json();
                const analysis = data.content[0].text;

                showAlert('analysisAlert', '✅ 분석이 완료되었습니다.', 'success');
                document.getElementById('analysisOutput').innerHTML = `
                    <div class="output-box">${analysis}</div>
                    <div style="margin-top: 15px;">
                        <button class="button secondary" onclick="copyToClipboard('analysisOutput')">📋 복사</button>
                        <button class="button secondary" onclick="downloadText('analysis_${new Date().getTime()}.txt', document.querySelector('#analysisOutput .output-box').innerText)">⬇️ 다운로드</button>
                    </div>
                `;
            } catch (error) {
                showAlert('analysisAlert', `❌ 오류: ${error.message}`, 'error');
            }
        }

        // 설정 저장
        function saveSettings() {
            const apiKey = document.getElementById('apiKey').value;
            const model = document.getElementById('model').value;
            const tone = document.getElementById('tone').value;

            if (!apiKey) {
                showAlert('settingsOutput', '⚠️ API 키를 입력해주세요.', 'warning');
                return;
            }

            localStorage.setItem('apiKey', apiKey);
            localStorage.setItem('model', model);
            localStorage.setItem('tone', tone);

            showAlert('settingsOutput', '✅ 설정이 저장되었습니다.', 'success');
        }

        // API 테스트
        async function testApi() {
            const apiKey = document.getElementById('apiKey').value;

            if (!apiKey) {
                showAlert('settingsOutput', '⚠️ API 키를 입력해주세요.', 'warning');
                return;
            }

            showAlert('settingsOutput', '⏳ API 연결을 테스트 중입니다...', 'info');

            try {
                const response = await fetch(`${API_BASE}/messages`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-haiku-4-5',
                        max_tokens: 100,
                        messages: [
                            { role: 'user', content: '간단히 "연결 성공"이라고 답변해주세요.' }
                        ]
                    })
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        throw new Error('API 키가 유효하지 않습니다.');
                    }
                    throw new Error(`API 오류: ${response.status}`);
                }

                const data = await response.json();
                showAlert('settingsOutput', `✅ API 연결 성공! (응답: "${data.content[0].text.trim()}")`, 'success');
            } catch (error) {
                showAlert('settingsOutput', `❌ 연결 실패: ${error.message}`, 'error');
            }
        }

        // 알림 표시
        function showAlert(containerId, message, type) {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="alert ${type}">${message}</div>`;
        }

        // 텍스트 복사
        function copyToClipboard(elementId) {
            const text = document.querySelector(`#${elementId} .output-box`).innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('클립보드에 복사되었습니다.');
            });
        }

        // 파일 다운로드
        function downloadText(filename, text) {
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
            element.setAttribute('download', filename);
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }

        // 데이터 내보내기
        function exportData() {
            const data = {
                profile: localStorage.getItem('profile'),
                apiKey: localStorage.getItem('apiKey'),
                model: localStorage.getItem('model'),
                tone: localStorage.getItem('tone'),
                exportDate: new Date().toISOString()
            };

            downloadText('go_data.json', JSON.stringify(data, null, 2));
            alert('데이터가 다운로드되었습니다.');
        }

        // 데이터 가져오기
        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.profile) localStorage.setItem('profile', data.profile);
                        if (data.model) localStorage.setItem('model', data.model);
                        if (data.tone) localStorage.setItem('tone', data.tone);
                        loadSettings();
                        displayProfile();
                        showAlert('settingsOutput', '✅ 데이터를 불러왔습니다.', 'success');
                    } catch (error) {
                        showAlert('settingsOutput', '❌ 파일 형식이 잘못되었습니다.', 'error');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // 모든 데이터 삭제
        function clearAllData() {
            if (confirm('모든 저장된 데이터를 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) {
                localStorage.clear();
                location.reload();
            }
        }

        // 설정 로드
        function loadSettings() {
            const apiKey = localStorage.getItem('apiKey');
            const model = localStorage.getItem('model');
            const tone = localStorage.getItem('tone');

            if (apiKey) document.getElementById('apiKey').value = apiKey;
            if (model) document.getElementById('model').value = model;
            if (tone) document.getElementById('tone').value = tone;
        }

        // 페이지 로드
        window.addEventListener('load', () => {
            loadSettings();
            displayProfile();
        });
    </script>
</body>
</html>
